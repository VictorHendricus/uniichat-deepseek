# The iOS app (ios/), built on GitHub's macOS runners; run by hand
# (Actions > ios > Run workflow).
# `shots`: a simulator build, its screenshots kept as the artifact
# `shots`. `testflight`: signed with the team's App Store Connect key
# (repo secrets) and uploaded to TestFlight, numbered by the run.
name: ios
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [shots, testflight]
        default: shots
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - if: inputs.lane == 'shots'
        run: ios/ios.sh shots "$RUNNER_TEMP/shots"
      - if: inputs.lane == 'shots'
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ runner.temp }}/shots
      - if: inputs.lane == 'testflight'
        run: ios/ios.sh testflight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          BUILD: ${{ github.run_number }}
